name: Update pi-kit dependencies

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and validate without committing to main or publishing
        type: boolean
        default: true

concurrency:
  group: pi-kit-dependency-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - name: Check out main without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Discover, synchronize, install and validate updates
        id: prepare
        env:
          UPDATE_REPORT_PATH: ${{ runner.temp }}/pi-kit-update-report.md
        run: node scripts/check-updates.mjs
      - name: Show the complete prepared diff
        if: steps.prepare.outputs.changed == 'true'
        run: git diff -- package.json package-lock.json README.md CHANGELOG.md
      - name: Transfer only the four prepared data files
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: prepared-pi-kit-update
          if-no-files-found: error
          retention-days: 7
          path: |
            package.json
            package-lock.json
            README.md
            CHANGELOG.md

  apply-update:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the trusted base on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js without installing dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download this run's prepared data outside the checkout
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: prepared-pi-kit-update
          path: ${{ runner.temp }}/pi-kit-prepared
      - name: Validate the data and commit only the allowed update to main
        if: needs.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_PATH: ${{ runner.temp }}/pi-kit-prepared
          UPDATE_REPORT_PATH: ${{ runner.temp }}/pi-kit-update-report.md
        run: |
          gh auth setup-git --hostname github.com
          node scripts/check-updates.mjs --apply-prepared "$PREPARED_PATH"
      - name: Check for a main version awaiting publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main changed; stop rather than publish an unexpected commit.' >&2
            exit 1
          fi
          node scripts/publish-pi-kit.mjs check
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Explicitly dispatch the OIDC publisher for this exact commit
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          gh workflow run publish-pi-kit.yml --ref main -f expected_commit="$EXPECTED_COMMIT"
          echo 'Publication requested; follow the Publish pi-kit workflow for the result.' >> "$GITHUB_STEP_SUMMARY"
